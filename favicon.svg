<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Clearwell">
  <!--
    The Clearwell mark (the app was named Cistern until 2026-10-20): a water tower holding water to a waved waterline, on a full-bleed safety-orange
    tile (brand.md 'Icon'). 24-unit grid; docs/product/assets/generate-assets.py draws every icon from
    these same numbers (ROOF, TANK, WATER, LEGS, RISER) and tokens.json's colours.
      tile  : 0..24 square, linear gradient icon-tile-top #FFA24C to icon-tile-bottom #EE5F17
      roof  : triangle apex (12,4), eaves (4.75,7.25) and (19.25,7.25), 1-unit round outline
      tank  : rounded rect x=5 y=6.75 w=14 h=8.5 rx=2.75 (surface-light #FFFFFF)
      water : x 6.75..17.25, waterline y=10 waved (amplitude 0.45, 1.5 cycles) down to y=13.5, rx=1.5 below
              (cistern-blue #0B6E8F)
      legs  : 2-unit bars (7.75,14.75)->(6.5,19.75) and (16.25,14.75)->(17.5,19.75), round feet
      riser : 2-unit bar (12,14.75)->(12,19.75), round foot
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA24C" />
      <stop offset="1" stop-color="#EE5F17" />
    </linearGradient>
    <clipPath id="inner"><path d="M6.75 9 H17.25 V12 a1.5 1.5 0 0 1 -1.5 1.5 H8.25 a1.5 1.5 0 0 1 -1.5 -1.5 Z" /></clipPath>
  </defs>
  <rect width="24" height="24" fill="url(#tile)" />
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12,4 19.25,7.25 4.75,7.25" stroke-width="1" />
    <rect x="5" y="6.75" width="14" height="8.5" rx="2.75" stroke="none" />
    <line x1="7.75" y1="14.75" x2="6.5" y2="19.75" stroke-width="2" />
    <line x1="16.25" y1="14.75" x2="17.5" y2="19.75" stroke-width="2" />
    <line x1="12" y1="14.75" x2="12" y2="19.75" stroke-width="2" />
  </g>
  <polygon points="6.75,10.00 7.19,10.17 7.62,10.32 8.06,10.42 8.50,10.45 8.94,10.42 9.38,10.32 9.81,10.17 10.25,10.00 10.69,9.83 11.12,9.68 11.56,9.58 12.00,9.55 12.44,9.58 12.88,9.68 13.31,9.83 13.75,10.00 14.19,10.17 14.62,10.32 15.06,10.42 15.50,10.45 15.94,10.42 16.38,10.32 16.81,10.17 17.25,10.00 17.25,13.5 6.75,13.5" fill="#0B6E8F" clip-path="url(#inner)" />
</svg>
